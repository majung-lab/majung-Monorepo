openapi: 3.1.0
info:
  title: Majung visit API
  version: 1.0.0
  description: |
    Maps majung-lab/majung-db SQLite schema to the vehicle and passenger clients.
    Each visit has separate unguessable driver/passenger capability tokens. A token in
    a path authorizes that role; visit UUIDs alone authorize nothing. Links expire after
    24 hours. Device IDs are unguessable UUID history capabilities and must stay private.
    Every mutation is transactional and idempotent by requestId; retries must keep the
    same requestId and payload. A stale version returns 409 without applying the change.
    Every successful mutation increments version. User interfaces must refresh on 409.
    Facility seed data is EXAMPLE data with temporary coordinates, never verified venues.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Server is ready; the canonical database initialized successfully.
  /api/facilities:
    get:
      operationId: listFacilities
      responses:
        '200':
          description: Facilities, access points, waiting spots and walking connections.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Facility' }
  /api/facilities/{id}/weather:
    get:
      operationId: getFacilityWeather
      description: >
        Weather at the facility for the next few hours (KMA short-term forecast) and the usable access points
        for the mode in recommended order. When rain or snow is expected within 6 hours, covered routes come
        first; then spots this driver rated well; then the shortest walk. weather is null when the forecast is unavailable.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [PICKUP, PARK, DROPOFF] } }
        - name: driverDeviceId
          in: query
          required: false
          description: When given, this driver's past ratings also order the ranking (liked spots first, disliked last). Covered routes in rain still come first.
          schema: { type: string, minLength: 24, maxLength: 128 }
      responses:
        '200':
          description: Weather and ranking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityWeather' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits:
    post:
      operationId: createVisit
      description: |
        Creates a visit, canonical candidates, and driver/passenger participants.
        PICKUP/DROPOFF only select allowed PICKUP points; PARK only selects parking entrances.
        Return the passenger token in the QR link and retain the driver token privately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVisitRequest' }
      responses:
        '201':
          description: Created session, or the original session for an identical retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitSession' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits/{token}:
    parameters:
      - { $ref: '#/components/parameters/Token' }
    get:
      operationId: getVisit
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateVisit
      description: |
        Driver alone sets phase, vehicle, parkingFloor; passenger alone sets readiness, location,
        passengerWaitSpotId and passengerConditions.
        Driver may directly set accessPointId only for PARK/DROPOFF; PICKUP always requires
        the other participant to accept a proposal. Candidates must belong to this visit.
        Valid phase transitions are PREPARING -> MOVING -> ARRIVED -> COMPLETED; any active
        phase may become CANCELLED. Terminal visits cannot be updated, except the separate
        driver rating endpoint. Location may be null to stop sharing. Both vehicle coordinates
        must be null together when GPS is unavailable; no fabricated coordinates are required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVisitRequest' }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits/{token}/proposals:
    parameters:
      - { $ref: '#/components/parameters/Token' }
    post:
      operationId: createProposal
      description: Either role may propose another valid candidate; only one pending proposal per visit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProposalRequest' }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits/{token}/proposals/{id}/respond:
    parameters:
      - { $ref: '#/components/parameters/Token' }
      - { $ref: '#/components/parameters/ProposalId' }
    post:
      operationId: respondProposal
      description: Only the other role may respond. Proposals expire after 10 minutes. Acceptance changes the confirmed candidate atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondProposalRequest' }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits/{token}/proposals/{id}:
    parameters:
      - { $ref: '#/components/parameters/Token' }
      - { $ref: '#/components/parameters/ProposalId' }
    delete:
      operationId: cancelProposal
      description: The proposer alone may cancel; the proposal is reported as CANCELLED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MutationRequest' }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits/{token}/recommendation:
    parameters:
      - { $ref: '#/components/parameters/Token' }
    get:
      operationId: getRecommendation
      description: >
        Used by the passenger view (any participant token of the visit is accepted, also after it ends).
        Re-ranks the visit's usable access points from the passenger's chosen wait spot and
        move conditions. Routes the conditions rule out (no route, stroller impossible, stairs) get excludedReason
        and go last; the rest put covered routes first in rain or with indoorOnly, step-free routes first with luggage,
        then the shortest walk. Without a chosen wait spot it falls back to the weather/walk ranking (past ratings
        are not applied) and excludedReason/walkMinutes are omitted.
      responses:
        '200':
          description: Weather and ranking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilityWeather' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits/{token}/rating:
    parameters:
      - { $ref: '#/components/parameters/Token' }
    post:
      operationId: rateVisit
      description: Driver alone may save one rating after COMPLETED, before link expiry. Device history retains it after expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateVisitRequest' }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/visits/{token}/invites:
    parameters:
      - { $ref: '#/components/parameters/Token' }
    post:
      operationId: inviteBySms
      description: >
        Driver alone texts the passenger link to a Korean mobile number while the visit is not
        COMPLETED/CANCELLED. The server builds the message and link itself (PASSENGER_WEB_URL), so
        clients cannot send arbitrary text. The number is not stored; only the masked number is
        returned. Same requestId does not send twice. At most 5 messages per visit (429).
        SMS_PROVIDER=console (default) only prints the message for local development; no real SMS
        provider is connected yet. Retry memory and the per-visit count live in server memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '200':
          description: Sent (or replayed) invite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResult' }
        '429': { $ref: '#/components/responses/Error' }   # TOO_MANY_INVITES: more than 5 messages for this visit
        '502': { $ref: '#/components/responses/Error' }   # SMS_FAILED: the SMS provider failed
        default: { $ref: '#/components/responses/Error' }
  /api/history:
    get:
      operationId: listHistory
      description: Most recent 100 visits of this device, including terminal and expired visits. Device ID is a private capability.
      parameters:
        - name: driverDeviceId
          in: query
          required: true
          schema: { type: string, minLength: 24, maxLength: 128 }
      responses:
        '200':
          description: Device visit history; does not expose participant tokens or passenger GPS.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryEntry' }
        default: { $ref: '#/components/responses/Error' }
components:
  parameters:
    Token:
      name: token
      in: path
      required: true
      description: Role-specific bearer capability, not the visit UUID.
      schema: { type: string }
    ProposalId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Snapshot:
      description: Current visit snapshot for the requesting role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VisitSnapshot' }
    Error:
      description: 400 invalid input, 403 wrong role, 404 unknown link, 409 stale/conflicting state, 410 expired link, 429 too many invites, 500 internal failure, 502 SMS provider failure.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
  schemas:
    Visit:
      type: object
      required: [id, facilityId, mode, phase, confirmedAccessPointId, version, passengerReadiness, updatedAt, expiresAt, parkingFloor, completedAt]
      properties:
        id: { type: string }
        facilityId: { type: string }
        mode: &mode { type: string, enum: [PICKUP, PARK, DROPOFF] }
        phase: &phase { type: string, enum: [PREPARING, MOVING, ARRIVED, COMPLETED, CANCELLED] }
        confirmedAccessPointId: { type: string }
        version: &version { type: integer, minimum: 1 }
        passengerReadiness: &readiness { type: string, enum: [UNSEEN, SEEN, READY, HEADING_OUT, AT_LOBBY], description: 'Link not opened, opened, ready, heading to the lobby, at the lobby.' }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        parkingFloor: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
    AccessPoint:
      type: object
      required: [id, name, lat, lng, description, kind, allowed, waitSpot, walkMinutes, covered, waitSpots]
      properties:
        id: { type: string }
        name: { type: string }
        lat: &lat { type: number, minimum: -90, maximum: 90 }
        lng: &lng { type: number, minimum: -180, maximum: 180 }
        description: { type: string }
        kind: { type: string, enum: [PICKUP, PARKING_ENTRANCE] }
        allowed: { type: boolean }
        waitSpot:
          type: [object, 'null']
          required: [name, floor, description]
          properties:
            name: { type: string }
            floor: { type: [string, 'null'] }
            description: { type: string }
        walkMinutes: { type: [integer, 'null'] }
        covered: { type: boolean }
        waitSpots:
          type: array
          description: Waiting spots connected to this access point, nearest first.
          items: { $ref: '#/components/schemas/WaitSpotOption' }
    WaitSpotOption:
      type: object
      required: [id, name, floor, description, walkMinutes, covered]
      properties:
        id: { type: string }
        name: { type: string }
        floor: { type: [string, 'null'] }
        description: { type: string }
        walkMinutes: { type: integer, minimum: 0 }
        covered: { type: boolean }
    Weather:
      type: object
      required: [condition, tempC, rainChance, rainSoon, summary, checkedAt, source]
      properties:
        condition: { type: string, enum: [CLEAR, CLOUDY, RAIN, SNOW] }
        tempC: { type: [integer, 'null'] }
        rainChance: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        rainSoon: { type: boolean, description: Raining now or expected within 6 hours. }
        summary: { type: string, description: 'One display line, e.g. "15시부터 비 · 강수확률 70%".' }
        checkedAt: { type: string, format: date-time }
        source: { type: string, enum: [KMA, DEMO] }
    RankedAccessPoint:
      type: object
      required: [accessPointId, recommended, reason]
      properties:
        accessPointId: { type: string }
        recommended: { type: boolean }
        reason: { type: [string, 'null'] }
        excludedReason: { type: [string, 'null'], description: 'Recommendation endpoint only. Why the chosen wait spot and conditions rule this point out.' }
        walkMinutes: { type: [integer, 'null'], description: 'Recommendation endpoint only. Walk from the chosen wait spot.' }
    FacilityWeather:
      type: object
      required: [weather, ranking]
      properties:
        weather:
          oneOf: [{ $ref: '#/components/schemas/Weather' }, { type: 'null' }]
        ranking:
          type: array
          items: { $ref: '#/components/schemas/RankedAccessPoint' }
    Facility:
      type: object
      required: [id, name, address, lat, lng, accessPoints, waitSpots, dataStatus]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        lat: *lat
        lng: *lng
        accessPoints:
          type: array
          items: { $ref: '#/components/schemas/AccessPoint' }
        waitSpots:
          type: array
          description: Every place inside the facility where people wait (lobbies, lounges).
          items: { $ref: '#/components/schemas/FacilityWaitSpot' }
        dataStatus: { type: string, enum: [EXAMPLE] }
    FacilityWaitSpot:
      type: object
      required: [id, name, floor, description]
      properties:
        id: { type: string }
        name: { type: string }
        floor: { type: [string, 'null'] }
        description: { type: string }
    MoveConditions:
      type: object
      additionalProperties: false
      required: [stroller, luggage, avoidStairs, indoorOnly]
      properties:
        stroller: { type: boolean }
        luggage: { type: boolean }
        avoidStairs: { type: boolean }
        indoorOnly: { type: boolean }
    MeetingProposal:
      type: object
      required: [id, visitId, proposedBy, accessPointId, fromAccessPointId, baseVersion, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        visitId: { type: string }
        proposedBy: &role { type: string, enum: [DRIVER, PASSENGER] }
        accessPointId: { type: string }
        fromAccessPointId: { type: string }
        baseVersion: *version
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    PlaceRating:
      type: object
      required: [rating, tags, comment]
      properties:
        rating: &rating { type: integer, minimum: 1, maximum: 5 }
        tags: &tags { type: array, maxItems: 10, items: { type: string, maxLength: 80 } }
        comment: { type: [string, 'null'] }
    VisitSnapshot:
      type: object
      required: [visit, role, facility, proposals, vehicle, passengerLocation, passengerWaitSpot, passengerConditions, rating]
      properties:
        visit: { $ref: '#/components/schemas/Visit' }
        role: *role
        facility: { $ref: '#/components/schemas/Facility' }
        proposals:
          type: array
          items: { $ref: '#/components/schemas/MeetingProposal' }
        vehicle:
          type: [object, 'null']
          required: [lat, lng, etaSec, navResult, recordedAt]
          properties:
            lat: { type: [number, 'null'], minimum: -90, maximum: 90 }
            lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
            etaSec: { type: [integer, 'null'], minimum: 0 }
            navResult: { type: [string, 'null'], enum: [set, failed, null] }
            recordedAt: { type: string, format: date-time }
        passengerLocation:
          type: [object, 'null']
          required: [lat, lng, recordedAt]
          properties:
            lat: *lat
            lng: *lng
            recordedAt: { type: string, format: date-time }
        passengerWaitSpot:
          description: Where the passenger said they are waiting, kept when the meeting point changes. walkMinutes and covered describe the route to the current meeting point; walkMinutes is null when no route is known.
          oneOf:
            - allOf:
                - { $ref: '#/components/schemas/FacilityWaitSpot' }
                - type: object
                  required: [walkMinutes, covered]
                  properties:
                    walkMinutes: { type: [integer, 'null'] }
                    covered: { type: boolean }
            - { type: 'null' }
        passengerConditions: { $ref: '#/components/schemas/MoveConditions' }
        rating:
          oneOf:
            - { $ref: '#/components/schemas/PlaceRating' }
            - { type: 'null' }
    VisitSession:
      type: object
      required: [visit, driverToken, passengerToken]
      properties:
        visit: { $ref: '#/components/schemas/Visit' }
        driverToken: { type: string }
        passengerToken: { type: string }
    HistoryEntry:
      type: object
      required: [visit, facility, rating, weather]
      properties:
        visit: { $ref: '#/components/schemas/Visit' }
        facility: { $ref: '#/components/schemas/Facility' }
        rating:
          oneOf:
            - { $ref: '#/components/schemas/PlaceRating' }
            - { type: 'null' }
        weather:
          description: Weather snapshot taken when the visit was created.
          oneOf:
            - { $ref: '#/components/schemas/Weather' }
            - { type: 'null' }
    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [requestId, phone]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 128 }
        phone: { type: string, maxLength: 32, description: 'Korean mobile number; hyphens, spaces and +82 accepted' }
    InviteResult:
      type: object
      required: [sentTo]
      properties:
        sentTo: { type: string, description: 'Masked number, e.g. 010-****-5678' }
    MutationRequest:
      type: object
      additionalProperties: false
      required: [requestId, version]
      properties:
        requestId: &requestId { type: string, minLength: 1, maxLength: 128 }
        version: *version
    CreateVisitRequest:
      type: object
      additionalProperties: false
      required: [requestId, facilityId, mode, accessPointId, driverDeviceId]
      properties:
        requestId: *requestId
        facilityId: &id { type: string, pattern: '^[1-9][0-9]*$', maxLength: 16 }
        mode: *mode
        accessPointId: *id
        driverDeviceId: { type: string, minLength: 24, maxLength: 128 }
    UpdateVisitRequest:
      type: object
      additionalProperties: false
      minProperties: 3
      required: [requestId, version]
      properties:
        requestId: *requestId
        version: *version
        accessPointId: *id
        phase: *phase
        passengerReadiness: *readiness
        parkingFloor: { type: [string, 'null'], minLength: 1, maxLength: 32 }
        passengerWaitSpotId:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*$'
          description: Passenger-only. One of the facility's waitSpots; null clears it.
        passengerConditions:
          allOf: [{ $ref: '#/components/schemas/MoveConditions' }]
          description: Passenger-only. Replaces all four move conditions.
        passengerLocation:
          type: [object, 'null']
          additionalProperties: false
          required: [lat, lng]
          properties:
            lat: *lat
            lng: *lng
        vehicle:
          type: object
          additionalProperties: false
          required: [lat, lng, etaSec]
          properties:
            lat: { type: [number, 'null'], minimum: -90, maximum: 90 }
            lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
            etaSec: { type: [integer, 'null'], minimum: 0, maximum: 86400 }
            navResult: { type: string, enum: [set, failed] }
    CreateProposalRequest:
      type: object
      additionalProperties: false
      required: [requestId, version]
      description: Send accessPointId for a registered point or location for a free map pin.
      oneOf:
        - required: [accessPointId]
        - required: [location]
      properties:
        requestId: *requestId
        version: *version
        accessPointId: *id
        location:
          type: object
          additionalProperties: false
          required: [lat, lng]
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        reason: { type: string, maxLength: 500 }
    RespondProposalRequest:
      type: object
      additionalProperties: false
      required: [requestId, version, accept]
      properties:
        requestId: *requestId
        version: *version
        accept: { type: boolean }
    RateVisitRequest:
      type: object
      additionalProperties: false
      required: [requestId, version, rating, tags]
      properties:
        requestId: *requestId
        version: *version
        rating: *rating
        tags: *tags
        comment: { type: string, maxLength: 1000 }
x-websocket:
  path: /ws/visits/{token}
  description: |
    Same token authority and expiry as REST. The first and each subsequent message is a
    VisitSnapshot JSON object without an envelope, with the subscriber's own role.
    Clients must additionally poll GET /api/visits/{token} every 5 seconds for reconnect,
    proposal expiration, or missed-message recovery. Losing connectivity never approves
    proposals or completes a visit automatically. Invalid/expired tokens cannot upgrade.
